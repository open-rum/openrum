name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint TypeScript and vet Go
        run: pnpm run lint

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Build all packages and services
        run: pnpm run build

      - name: Type-check workspaces
        run: pnpm run typecheck

      - name: Run unit and protocol fixture tests
        run: pnpm run test

      - name: Scan Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Verify generated protocol contract
        run: |
          pnpm run protocol:check
          git diff --exit-code -- internal/event/schema_gen.go

      - name: Test release metadata validation
        run: node --test scripts/release/check-version.test.mjs

      - name: Verify generated documentation and public-site content
        run: |
          pnpm run docs:check
          pnpm run site:spell
          pnpm run site:verify-demo
          node scripts/site/check-built-links.mjs
          node scripts/site/check-performance-budget.mjs

      - name: Enforce browser SDK size budget
        run: pnpm run sdk:size

      - name: Enforce Console initial-load budget
        run: pnpm run console:size

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run isolated PostgreSQL, ClickHouse, Kafka and Redis integration suite
        run: bash scripts/test-integration.sh

      - name: Preserve dependency logs on failure
        if: failure()
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/docker-compose.yml logs --no-color

  # Opt-in. Run it from the Actions tab, or add the `run-e2e` label to a pull
  # request. Kept out of the default path because it is the slowest job and its
  # value is concentrated in changes that touch the Console or the site.
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the Console
        run: pnpm run test:e2e

      - name: Test public-site accessibility and navigation
        run: pnpm run site:test:e2e
