name: Publish private package test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-package-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'eijil/openrum'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install browser for documentation checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Run private package smoke checks
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run build
          pnpm run typecheck
          pnpm run test
          pnpm run docs:generate
          pnpm run site:check
          pnpm run site:test:e2e

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      TEST_VERSION: 0.1.0-test.${{ github.run_number }}.${{ github.run_attempt }}
      PACKAGE_NAMESPACE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Install browser for generated documentation diagrams
        run: pnpm exec playwright install --with-deps chromium
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.21.4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check that this is a private test repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REPOSITORY" = 'eijil/openrum'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = 'true'
      - name: Prepare a chart pointing to the test image
        run: |
          node scripts/release/prepare-test-chart.mjs "$TEST_VERSION" "$PACKAGE_NAMESPACE" private-test-chart
          helm lint private-test-chart/openrum
          helm template openrum private-test-chart/openrum > /dev/null
          helm package private-test-chart/openrum --destination private-test-chart
      - name: Build private documentation image content
        env:
          PUBLIC_SITE_URL: https://openrum.dev
          PUBLIC_REPOSITORY_URL: https://github.com/eijil/openrum
          PUBLIC_OPENRUM_RELEASE: v${{ env.TEST_VERSION }}
          PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: |
          pnpm run docs:generate
          pnpm run site:build
          node scripts/site/check-built-links.mjs
      - name: Publish application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ env.PACKAGE_NAMESPACE }}/openrum:${{ env.TEST_VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VERSION=${{ env.TEST_VERSION }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Verify the application image
        run: |
          docker pull "ghcr.io/$PACKAGE_NAMESPACE/openrum:$TEST_VERSION"
          docker run --rm --entrypoint /bin/sh "ghcr.io/$PACKAGE_NAMESPACE/openrum:$TEST_VERSION" -ec \
            'test -x /app/api && test -x /app/ingest && test -x /app/consumer && test -x /app/worker && test -x /app/migrate && test -x /app/web'
      - name: Publish and verify private Helm chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "private-test-chart/openrum-$TEST_VERSION.tgz" "oci://ghcr.io/$PACKAGE_NAMESPACE/charts"
          helm show values "oci://ghcr.io/$PACKAGE_NAMESPACE/charts/openrum" --version "$TEST_VERSION" | \
            grep -F "repository: ghcr.io/$PACKAGE_NAMESPACE/openrum"
          helm show values "oci://ghcr.io/$PACKAGE_NAMESPACE/charts/openrum" --version "$TEST_VERSION" | \
            grep -F "tag: \"$TEST_VERSION\""
      - name: Publish documentation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/site/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ env.PACKAGE_NAMESPACE }}/openrum-site:${{ env.TEST_VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true
      - name: Verify the documentation image
        run: |
          docker pull "ghcr.io/$PACKAGE_NAMESPACE/openrum-site:$TEST_VERSION"
          docker run --rm --entrypoint /bin/sh "ghcr.io/$PACKAGE_NAMESPACE/openrum-site:$TEST_VERSION" -ec \
            'test -f /usr/share/nginx/html/index.html'
      - name: Summarize private test artifacts
        run: |
          {
            echo '### Private package test'
            echo
            echo "- Application: \`ghcr.io/$PACKAGE_NAMESPACE/openrum:$TEST_VERSION\`"
            echo "- Site: \`ghcr.io/$PACKAGE_NAMESPACE/openrum-site:$TEST_VERSION\`"
            echo "- Chart: \`oci://ghcr.io/$PACKAGE_NAMESPACE/charts/openrum --version $TEST_VERSION\`"
            echo '- No public release or deployment was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
