name: Public site

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "docs/**"
      - "scripts/docs/**"
      - "scripts/site/**"
      - "deploy/site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "docs/**"
      - "scripts/docs/**"
      - "scripts/site/**"
      - "deploy/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://openrum.dev
  PUBLIC_REPOSITORY_URL: https://github.com/openrum/openrum
  PUBLIC_OPENRUM_RELEASE: Alpha
  PUBLIC_COMMIT_SHA: ${{ github.sha }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm run site:build
      - run: node scripts/site/check-built-links.mjs
      - run: node scripts/site/check-performance-budget.mjs
      - name: Retain immutable review artifact
        uses: actions/upload-artifact@v6
        with:
          name: public-site-${{ github.sha }}
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 14

  production-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'openrum/openrum'
    needs: preview
    runs-on: ubuntu-latest
    environment: public-site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm run site:build
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/site/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openrum-site:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/openrum-site:main
