name: Public site

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "docs/**"
      - "scripts/docs/**"
      - "scripts/site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "docs/**"
      - "scripts/docs/**"
      - "scripts/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://openrum.dev
  PUBLIC_REPOSITORY_URL: https://github.com/open-rum/openrum
  PUBLIC_OPENRUM_RELEASE: Alpha
  PUBLIC_COMMIT_SHA: ${{ github.sha }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm run site:build
      - run: node scripts/site/check-built-links.mjs
      - run: node scripts/site/check-performance-budget.mjs
