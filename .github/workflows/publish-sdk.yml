name: Publish browser SDK

# The SDK has its own version lifecycle, separate from the product's vX.Y.Z tags.
# Tag the commit browser-vX.Y.Z (or browser-vX.Y.Z-alpha.N for a prerelease).
on:
  push:
    tags: ["browser-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "SDK tag to validate without publishing, for example browser-v0.1.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm a release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate the tag against the package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: node scripts/release/check-package-version.mjs
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Lint, type-check, test and build the SDK
        run: |
          pnpm --filter @openrum/browser lint
          pnpm --filter @openrum/browser typecheck
          pnpm --filter @openrum/browser test
          pnpm --filter @openrum/browser build
      - name: Prove the tarball installs and type-checks from a clean project
        run: node scripts/release/verify-package.mjs packages/browser-sdk

  publish:
    # A manual run only validates; publishing needs a pushed tag in the official repository.
    if: github.event_name == 'push' && github.repository == 'open-rum/openrum'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: public-release
    permissions:
      contents: read
      # Lets npm sign a provenance statement linking the package to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Reject a previously published npm version
        run: |
          if npm view "@openrum/browser@${{ needs.verify.outputs.version }}" version >/dev/null 2>&1; then
            echo "@openrum/browser@${{ needs.verify.outputs.version }} already exists on npm; publish a new version instead of overwriting it." >&2
            exit 1
          fi
      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
          # npm refuses to sign provenance for a private source repository, so the flag
          # is only passed once the repository is public.
          PROVENANCE: ${{ github.event.repository.private == false && '--provenance' || '' }}
        run: |
          # Trusted Publishing: npm trusts this workflow's OIDC identity (repository, workflow
          # file and the public-release environment, configured on npmjs.com), so no token is
          # stored. pnpm exchanges the identity for a short-lived publish credential.
          pnpm --filter @openrum/browser build
          pnpm --filter @openrum/browser publish --access public $PROVENANCE --tag "$NPM_TAG" --no-git-checks
      - name: Verify the published package
        run: |
          # A new version can take a few minutes to appear; wait up to 10 minutes.
          for attempt in $(seq 1 60); do
            if npm view "@openrum/browser@${{ needs.verify.outputs.version }}" version; then exit 0; fi
            sleep 10
          done
          echo "@openrum/browser@${{ needs.verify.outputs.version }} did not appear on npm." >&2
          exit 1
