server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location /_astro/ { try_files $uri =404; add_header Cache-Control "public,max-age=31536000,immutable" always; }
  location / { try_files $uri $uri/ $uri.html /404.html; add_header Cache-Control "public,max-age=300,must-revalidate" always; }
  location = /health/ready { default_type application/json; return 200 '{"status":"ready"}'; }
}
