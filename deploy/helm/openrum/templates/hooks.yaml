apiVersion: v1
kind: Pod
metadata:
  name: {{ include "openrum.fullname" . }}-smoke-test
  labels:
    {{- include "openrum.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{ toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: smoke-test
      image: {{ .Values.smokeTest.image | quote }}
      command:
        - /bin/sh
        - -ec
        - >-
          wget -qO- http://{{ include "openrum.fullname" . }}-api{{ .Values.services.api.livePath }} >/dev/null &&
          wget -qO- http://{{ include "openrum.fullname" . }}-ingest{{ .Values.services.ingest.livePath }} >/dev/null &&
          wget -qO- http://{{ include "openrum.fullname" . }}-web{{ .Values.services.web.livePath }} >/dev/null
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }
