{{- if .Values.autoscaling.enabled }}
{{- range $name, $target := .Values.autoscaling.targets }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "openrum.fullname" $ }}-{{ $name }}
  labels: {{- include "openrum.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "openrum.fullname" $ }}-{{ $name }} }
  minReplicas: {{ $target.minReplicas }}
  maxReplicas: {{ $target.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $target.cpu }} }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30 }
{{- end }}
{{- end }}
