apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openrum.fullname" . }}
  labels:
    {{- include "openrum.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  PUBLIC_BASE_URL: {{ .Values.config.publicBaseURL | quote }}
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  KAFKA_EVENT_TOPIC: {{ .Values.config.kafkaEventTopic | quote }}
  OPENRUM_KAFKA_RETENTION_DURATION: {{ .Values.config.kafkaRetentionDuration | quote }}
  REDIS_ADDR: {{ .Values.config.redisAddress | quote }}
  OPENRUM_STORAGE_PRESSURE_GUARD_ENABLED: {{ .Values.config.storagePressure.guardEnabled | quote }}
  OPENRUM_STORAGE_WARNING_FREE_RATIO: {{ .Values.config.storagePressure.warningFreeRatio | quote }}
  OPENRUM_STORAGE_CRITICAL_FREE_RATIO: {{ .Values.config.storagePressure.criticalFreeRatio | quote }}
  OPENRUM_STORAGE_HARD_STOP_FREE_RATIO: {{ .Values.config.storagePressure.hardStopFreeRatio | quote }}
  OPENRUM_STORAGE_RECOVERY_FREE_RATIO: {{ .Values.config.storagePressure.recoveryFreeRatio | quote }}
  OPENRUM_STORAGE_EMERGENCY_SAMPLE_RATE: {{ .Values.config.storagePressure.emergencySampleRate | quote }}
  OPENRUM_STORAGE_POLL_INTERVAL: {{ .Values.config.storagePressure.pollInterval | quote }}
  INGEST_TRUSTED_PROXIES: {{ .Values.config.ingestTrustedProxies | quote }}
  GEO_COUNTRY_HEADER: {{ .Values.config.geoCountryHeader | quote }}
  GEO_TRUSTED_PROXIES: {{ .Values.config.geoTrustedProxies | quote }}
  OBJECT_STORAGE_PROVIDER: {{ .Values.config.objectStorage.provider | quote }}
  OBJECT_STORAGE_ENDPOINT: {{ .Values.config.objectStorage.endpoint | quote }}
  OBJECT_STORAGE_BUCKET: {{ .Values.config.objectStorage.bucket | quote }}
  OBJECT_STORAGE_REGION: {{ .Values.config.objectStorage.region | quote }}
  OBJECT_STORAGE_FORCE_PATH_STYLE: {{ .Values.config.objectStorage.forcePathStyle | quote }}
  OPENRUM_OBJECT_STORAGE_ENDPOINT_ALLOWLIST: {{ .Values.config.objectStorage.endpointAllowlist | quote }}
  OPENRUM_ALLOW_MANAGED_SECRETS: {{ .Values.config.managedSecrets.enabled | quote }}
  OPENRUM_MASTER_KEY_ID: {{ .Values.config.managedSecrets.masterKeyID | quote }}
