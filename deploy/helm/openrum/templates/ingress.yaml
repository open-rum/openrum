{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openrum.fullname" . }}
  labels: {{- include "openrum.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ include "openrum.fullname" . }}-api, port: { number: 80 } } }
          - path: /ingest
            pathType: Prefix
            backend: { service: { name: {{ include "openrum.fullname" . }}-ingest, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "openrum.fullname" . }}-web, port: { number: 80 } } }
{{- end }}
