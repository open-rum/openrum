# Skip Netlify builds when commits do not touch the public site, shared design/UI
# packages, synced canonical docs, or site/doc build scripts.
# Build command and publish directory remain configured in the Netlify dashboard.
[build]
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- apps/site packages/design-tokens packages/ui docs/operations docs/security scripts/docs scripts/site netlify.toml'
