<title id="org-model-title">实例、组织、项目与环境</title>
<desc id="org-model-desc">一个实例包含多个组织，每个组织包含多个项目，每个项目接受四个环境。实例角色作用于整个实例；组织角色只在一个组织及其项目内生效。</desc>
