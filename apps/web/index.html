<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="OpenRUM 前端真实用户监控平台" />
    <title>OpenRUM</title>
    <script>
      try {
        // Palette and density come before first paint, so nothing flashes the defaults.
        const palette = localStorage.getItem("openrum-palette");
        document.documentElement.dataset.palette = ["amber", "lime", "magenta"].includes(palette)
          ? palette
          : "amber";
        document.documentElement.dataset.density =
          localStorage.getItem("openrum-density") === "compact" ? "compact" : "comfortable";
        const saved = localStorage.getItem("openrum-theme") || "system";
        const resolved =
          saved === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : saved;
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
