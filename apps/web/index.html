<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="OpenRUM 前端真实用户监控平台" />
    <title>OpenRUM · 生产环境概览</title>
    <script>
      try {
        const palettes = ["acid", "citrus", "graphite"];
        const palette =
          new URLSearchParams(location.search).get("palette") ||
          localStorage.getItem("openrum-palette");
        document.documentElement.dataset.palette = palettes.includes(palette) ? palette : "acid";
        const saved = localStorage.getItem("openrum-theme") || "system";
        const resolved =
          saved === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : saved;
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
