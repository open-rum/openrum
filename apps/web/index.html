<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="OpenRUM 前端真实用户监控平台" />
    <title>OpenRUM</title>
    <script>
      try {
        // Any daisyUI theme name, or "system" for daisyUI's light and dark.
        const saved = localStorage.getItem("openrum-theme") || "system";
        const theme =
          saved === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : saved;
        // Keep in step with DARK_DAISY_THEMES in src/components/daisy/daisyTheme.ts.
        const dark = [
          "dark",
          "synthwave",
          "halloween",
          "forest",
          "aqua",
          "black",
          "luxury",
          "dracula",
          "business",
          "night",
          "coffee",
          "dim",
          "sunset",
          "abyss",
        ].includes(theme);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
